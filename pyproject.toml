[project]
name = "dlsu-handbook-chatbot"
version = "0.1.0"
description = "Local RAG chatbot for the DLSU Student Handbook (AY 2021-2025)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.11",          # PDF parsing with font metadata (docs/rag_pipeline.md §1)
    "sentence-transformers>=3.0", # Local embeddings: bge-small-en-v1.5
    "chromadb>=0.5,<0.6",        # Vector store — pinned minor; API has churned historically
    "openai>=1.30",              # OpenAI-compatible client, pointed at the Groq endpoint
    "pyyaml>=6.0",               # settings.yaml
    "rich>=13.0",                # Terminal rendering
    "rank-bm25>=0.2.2",
]

# uv installs this group by default on `uv sync` (exclude with --no-dev).
[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
# Custom markers keep intent explicit and silence "unknown mark" warnings.
markers = [
    "integration: test needs a downloaded model or network; skipped when unavailable",
]
# Silence third-party deprecation noise (ChromaDB 0.5 internals); our own
# code's warnings still surface.
filterwarnings = [
    "ignore::DeprecationWarning:chromadb.*",
    "ignore::DeprecationWarning:pydantic.*",
]

# uv reads standard [project] metadata; no uv-specific config is required.
# This section only silences build-backend warnings for a src-layout app
# that is run via scripts rather than installed as a distributable package.
[tool.setuptools]
packages = ["src"]
